name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Run tests and build APK
        run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "ZapretAndroid-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "ZapretAndroid-${GITHUB_REF_NAME}.apk"
          --title "ZapretAndroid $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
